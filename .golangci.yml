version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - contextcheck
    - govet
    - ineffassign
    - modernize
    - staticcheck
    - testableexamples
    - usetesting
    - unused
    - revive
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
  exclusions:
    rules:
      # Tests deliberately ignore errors and use type assertions without the
      # comma-ok form. The strict errcheck settings apply to production code.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
